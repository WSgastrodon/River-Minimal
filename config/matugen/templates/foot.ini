[cursor]
style=block
blink=yes

# NOTE: regular (0-7) are used as FOREGROUND TEXT colors by terminal apps
# (vim/nvim/htop/etc). They must stay light/readable against the dark
# background, so we map them to matugen's high-contrast "on_*_container"
# and on-color tokens instead of the dark container fills.
[colors-dark]
background={{colors.surface_container_low.default.hex_stripped}}
foreground={{colors.on_surface.default.hex_stripped}}
# light cursor block (inverse of the dark bg) so it stays clearly visible
cursor={{colors.inverse_on_surface.default.hex_stripped}} {{colors.inverse_surface.default.hex_stripped}}

regular0={{colors.on_surface_variant.default.hex_stripped}}
regular1={{colors.error.default.hex_stripped}}
regular2={{colors.tertiary.default.hex_stripped}}
regular3={{colors.secondary.default.hex_stripped}}
regular4={{colors.primary.default.hex_stripped}}
regular5={{colors.on_secondary_container.default.hex_stripped}}
regular6={{colors.on_tertiary_container.default.hex_stripped}}
regular7={{colors.on_surface.default.hex_stripped}}

# bright (8-15) are mostly for bold text / UI backgrounds; keep them lighter
# than their regular counterpart so bold stands out.
bright0={{colors.outline_variant.default.hex_stripped}}
bright1={{colors.on_error_container.default.hex_stripped}}
bright2={{colors.on_tertiary_container.default.hex_stripped}}
bright3={{colors.on_secondary_container.default.hex_stripped}}
bright4={{colors.on_primary_container.default.hex_stripped}}
bright5={{colors.on_primary_container.default.hex_stripped}}
bright6={{colors.on_tertiary_container.default.hex_stripped}}
bright7=ffffff

selection-foreground={{colors.on_primary_container.default.hex_stripped}}
selection-background={{colors.primary_container.default.hex_stripped}}
